<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediMart</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head><body>
<header>
 <div class="logo" id="logo"><svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><rect x="3" y="12" width="32" height="14" rx="7" transform="rotate(-35 19 19)" fill="#2f5bea"/><path d="M19 19l9.4-6.6a7 7 0 0 1 3.6 9.8z" transform="rotate(-35 19 19)" fill="#f3b61f"/></svg><div>MediMart<small>Meghavi Chemist, Parnera, Atul</small></div></div>
 <div class="sp"></div>
 <button class="alt" id="themeBtn" data-act="theme" aria-label="Switch between light and dark mode">Dark mode</button>
 <button class="alt" id="ordBtn" data-act="myorders" hidden>My orders</button>
 <button class="go" id="loginBtn" data-act="loginBtn">Log in</button>
 <button id="cartBtn" data-act="openCart">Cart<span class="badge" id="cnt">0</span></button>
</header>
<main id="app"></main>
<div class="veil" id="veil"><div class="box" id="modal"></div></div>
<aside id="drawer" aria-label="Cart"></aside>
<div id="toast" role="status"></div>
<script src="script.js" defer></script></body></html>
